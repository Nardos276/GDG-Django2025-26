<h2>Add / Update Book</h2>

<form method="POST">

{% csrf_token %}

Title:
<input type="text" name="title" value="{{ book.title|default:'' }}">
<br><br>

Author:

<select name="author">

{% for author in authors %}

<option value="{{ author.id }}">

{{ author.name }}

</option>

{% endfor %}

</select>

<br><br>

Published Date:

<input type="date" name="published_date"
value="{{ book.published_date|default:'' }}">

<br><br>

ISBN:

<input type="text" name="isbn"
value="{{ book.isbn|default:'' }}">

<br><br>

<button type="submit">Save</button>

</form>
